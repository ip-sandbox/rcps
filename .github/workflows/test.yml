name: test

on:
  push:
  pull_request:

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Run-Tests.ps1

  windows-pwsh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/Run-Tests.ps1

  ubuntu-pwsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (PowerShell 7)
        shell: pwsh
        run: pwsh -NoProfile -File tests/Run-Tests.ps1
